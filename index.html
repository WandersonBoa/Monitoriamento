<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo SobrePosto — Versão Profit Calibrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030a16; color: #ffffff; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; gap: 15px; }
        header { text-align: center; }
        h1 { font-size: 1.3rem; letter-spacing: 1px; color: #ffc107; }
        .painel-status { text-align: center; font-size: 0.85rem; color: #8fa0bc; margin-top: -5px; }
        
        .painel-graficos { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            flex-grow: 1; 
        }
        
        .grafico-box { 
            background: #041124; 
            border: 1px solid #0d203d; 
            border-radius: 8px; 
            padding: 15px; 
            width: 100%;
            height: calc(50vh - 60px);
            min-height: 280px;
            display: flex; 
            flex-direction: column; 
        }
        .container-chart { width: 100%; flex-grow: 1; }
    </style>
</head>
<body>

<header>
    <h1>📈 ATIVO SOBREPOSTO — GRÁFICOS COMBINADOS</h1>
    <div class="painel-status" id="status-carregamento">Sincronizando banco de dados histórico (09:00 às 18:00)...</div>
</header>

<div class="painel-graficos">
    <!-- GRÁFICO 2 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-2m" class="container-chart"></div>
    </div>
    
    <!-- GRÁFICO 5 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-5m" class="container-chart"></div>
    </div>
</div>

<script>
function iniciarSistema() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const scriptStock = document.createElement('script');
    scriptStock.src = urlBase + "highstock.js";
    
    scriptStock.onload = () => {
        const scriptData = document.createElement('script');
        scriptData.src = urlBase + "modules/data.js";
        scriptData.onload = carregarHistoricoComercial;
        document.head.appendChild(scriptData);
    };
    document.head.appendChild(scriptStock);
}

function criarConfiguracaoGrafico(titulo) {
    return {
        chart: { backgroundColor: '#031022' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        title: { text: titulo, style: { color: '#8fa0bc', fontSize: '14px', fontWeight: 'bold' } },
        xAxis: { 
            type: 'datetime', 
            gridLineColor: '#0b1d37', 
            gridLineWidth: 1, 
            ordinal: false,
            dateTimeLabelFormats: {
                minute: '%H:%M',
                hour: '%H:%M',
                day: '%H:%M'
            },
            labels: { style: { color: '#8fa0bc' } }
        },
        yAxis: {
            title: { text: '' },
            gridLineColor: '#0b1d37',
            lineWidth: 1,
            lineColor: '#0b1d37',
            opposite: true,
            plotLines: [{ value: 0, color: '#55647a', width: 1, dashStyle: 'shortdash', zIndex: 2 }]
        },
        plotOptions: {
            series: {
                lineWidth: 2,
                dataGrouping: { enabled: false },
                zones: [{ value: 0, color: '#ff1744' }, { color: '#00e676' }]
            }
        },
        series: [{ type: 'spline', name: 'vHistref', data: }]
    };
}

async function carregarHistoricoComercial() {
    const chart2M = Highcharts.stockChart('chart-2m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 2 MINUTOS (2M)'));
    const chart5M = Highcharts.stockChart('chart-5m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 5 MINUTOS (5M)'));

    try {
        // Puxa candles estáveis para estruturar a amostragem
        const proxyUrl = "https://" + "api" + "." + "binance" + ".com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=720";
        const resposta = await fetch(proxyUrl);
        const candles = await resposta.json();

        // Determina a janela comercial das 09:00 de hoje
        const hoje9Horas = new Date();
        hoje9Horas.setHours(9, 0, 0, 0);
        const timestamp9h = hoje9Horas.getTime();

        let dados1M =;

        candles.forEach(c => {
            const time = parseInt(c[0]);
            if (time >= timestamp9h) {
                dados1M.push({
                    time: time,
                    open: parseFloat(c[1]),
                    close: parseFloat(c[4])
                });
            }
        });

        // --- CONSOLIDAÇÃO DO TEMPO GRÁFICO DE 2 MINUTOS ---
        let pontos2M =;
        let historicoPrecos2M =;
        for (let i = 0; i < dados1M.length; i += 2) {
            if (!dados1M[i+1]) break;
            const item = dados1M[i+1]; // Pega o fechamento do candle de 2M

            const vAssetPrice = item.close * 0.95;
            const vFatorConversao = item.open / (item.open * 0.948);
            const vPrecoPlot = vAssetPrice * vFatorConversao;

            historicoPrecos2M.push(vPrecoPlot);
            if (historicoPrecos2M.length > 21) historicoPrecos2M.shift();

            const vAssetMedia = historicoPrecos2M.reduce((a, b) => a + b, 0) / historicoPrecos2M.length;
            const vHistRef = vPrecoPlot - vAssetMedia;

            pontos2M.push([item.time, vHistRef]);
        }
        chart2M.series[0].setData(pontos2M);

        // --- CONSOLIDAÇÃO DO TEMPO GRÁFICO DE 5 MINUTOS ---
        let pontos5M =;
        let historicoPrecos5M =;
        for (let i = 0; i < dados1M.length; i += 5) {
            if (!dados1M[i+4]) break;
            const item = dados1M[i+4]; // Pega o fechamento do candle de 5M

            const vAssetPrice = item.close * 0.95;
            const vFatorConversao = item.open / (item.open * 0.948);
            const vPrecoPlot = vAssetPrice * vFatorConversao;

            historicoPrecos5M.push(vPrecoPlot);
            if (historicoPrecos5M.length > 21) historicoPrecos5M.shift(); // Conforme seu PeriodoREF(21)

            const vAssetMedia = historicoPrecos5M.reduce((a, b) => a + b, 0) / historicoPrecos5M.length;
            const vHistRef = vPrecoPlot - vAssetMedia;

            pontos5M.push([item.time, vHistRef]);
        }
        chart5M.series[0].setData(pontos5M);

        document.getElementById('status-carregamento').innerText = "Horário de Monitoramento: 09:00 às 18:00 (Histórico Alinhado)";
        
        // Passa os buffers de médias preenchidos para continuar em tempo real sem saltos
        conectarDadosTempoReal(chart2M, chart5M, historicoPrecos2M, historicoPrecos5M);

    } catch (erro) {
        document.getElementById('status-carregamento').innerText = "Falha ao conectar na API. Aguardando mercado...";
        conectarDadosTempoReal(chart2M, chart5M, [], []);
    }
}

function conectarDadosTempoReal(chart2M, chart5M, historicoPrecos2M, historicoPrecos5M) {
    let proximaAtualizacao2M = 0;
    let proximaAtualizacao5M = 0;

    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const agora = new Date();
        const horaAtual = agora.getHours();
        if (horaAtual < 9 || horaAtual >= 18) return; // Trava estritamente às 18h

        const time = Date.now();
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        const vAssetPrice = closePrice * 0.95;
        const vFatorConversao = openPrice / (openPrice * 0.948);
        const vPrecoPlot = vAssetPrice * vFatorConversao;

        const limitePontos = 300;

        // --- ATUALIZAÇÃO 2 MINUTOS EM TEMPO REAL ---
        if (time >= proximaAtualizacao2M) {
            historicoPrecos2M.push(vPrecoPlot);
            if(historicoPrecos2M.length > 21) historicoPrecos2M.shift();
            const vAssetMedia2M = historicoPrecos2M.reduce((a, b) => a + b, 0) / historicoPrecos2M.length;
            const vHistRef2M = vPrecoPlot - vAssetMedia2M;

            chart2M.series[0].addPoint([time, vHistRef2M], true, chart2M.series[0].data.length > limitePontos);
            proximaAtualizacao2M = time + 120000; 
        }

        // --- ATUALIZAÇÃO 5 MINUTOS EM TEMPO REAL ---
        if (time >= proximaAtualizacao5M) {
            historicoPrecos5M.push(vPrecoPlot);
            if(historicoPrecos5M.length > 21) historicoPrecos5M.shift();
            const vAssetMedia5M = historicoPrecos5M.reduce((a, b) => a + b, 0) / historicoPrecos5M.length;
            const vHistRef5M = vAssetMedia5M !== 0 ? (vPrecoPlot - vAssetMedia5M) : 0;

            chart5M.series[0].addPoint([time, vHistRef5M], true, chart5M.series[0].data.length > limitePontos);
            proximaAtualizacao5M = time + 300000; 
        }
    };
}

iniciarSistema();
</script>
</body>
</html>
