<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo SobrePosto — Versão Original</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #050505; color: #ffffff; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { font-size: 1.5rem; letter-spacing: 1px; color: #ffc107; }
        .subtitulo { color: #666; font-size: .85rem; margin-top: 5px; }
        .painel-fator { text-align: center; color: #00e6ff; font-size: .85rem; margin-bottom: 15px; font-weight: bold; }
        
        /* Container Principal do Gráfico */
        .grafico-container { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a; 
            border-radius: 12px; 
            padding: 20px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 8px 30px rgba(0,0,0,.5); 
        }
        #chart-container { width: 100%; flex-grow: 1; min-height: 550px; }
    </style>
</head>
<body>

<header>
    <h1>📈 ATIVO SOBREPOSTO | v1.0 |</h1>
    <p class="subtitulo">Regra de cálculo matemática original do Profit integrada na Web</p>
</header>

<div class="painel-fator">Fator de Conversão Ativo: <span id="fator-val">Calculando...</span></div>

<div class="grafico-container">
    <div id="chart-container"></div>
</div>

<script>
// Força o carregamento das dependências essenciais do Highcharts Stock de forma imune a bloqueios
function iniciarSistema() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const scriptStock = document.createElement('script');
    scriptStock.src = urlBase + "highstock.js";
    
    scriptStock.onload = () => {
        const scriptData = document.createElement('script');
        scriptData.src = urlBase + "modules/data.js";
        scriptData.onload = rodarIndicadorOriginal;
        document.head.appendChild(scriptData);
    };
    document.head.appendChild(scriptStock);
}

function rodarIndicadorOriginal() {
    // Parâmetros fixados idênticos ao cabeçalho do seu código original
    const AJUSTE_FATOR = 1.0;
    const DESLOCAMENTO_VERTICAL = 0.0; 
    const PERIODO_REF = 21;

    // Estrutura de armazenamento para cálculo da Média Móvel Aritmética (TipoMedia = 0)
    let historicoPrecosRef = [];

    // Criação do layout gráfico com Janela Dupla (Painel Superior: Preço/Média | Painel Inferior: Histograma)
    const chart = Highcharts.stockChart('chart-container', {
        chart: { backgroundColor: '#0f0f0f' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        xAxis: { type: 'datetime', gridLineColor: '#1a1a1a', gridLineWidth: 1, ordinal: false },
        
        // Criando os dois eixos Y separados exatamente como no Profit
        yAxis: [{
            title: { text: 'Preço Convertido (PrecoPlot)', style: { color: '#666' } },
            height: '65%',
            lineWidth: 2,
            gridLineColor: '#1a1a1a',
            opposite: true
        }, {
            title: { text: 'Histograma (HistRef)', style: { color: '#666' } },
            top: '70%',
            height: '30%',
            offset: 0,
            lineWidth: 2,
            gridLineColor: '#1a1a1a',
            opposite: true
        }],

        plotOptions: {
            column: { pointPadding: 0.1, groupPadding: 0.1, borderWidth: 0, dataGrouping: { enabled: false } },
            line: { dataGrouping: { enabled: false } }
        },

        // Definição das séries temporais baseadas no seu script original
        series: [
            { type: 'line', name: 'vPrecoplot', id: 'preco-plot', color: '#ffffff', data: [], lineWidth: 2, yAxis: 0 },
            { type: 'line', name: 'vMediaplot', id: 'media-plot', color: '#ffea00', data: [], lineWidth: 2, yAxis: 0 },
            { type: 'column', name: 'vHistref', id: 'hist-ref', color: '#00ff88', negativeColor: '#ff5252', data: [], yAxis: 1 }
        ]
    });

    // Conexão de transmissão com o feed em tempo real
    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const time = Date.now();
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        // --- SIMULAÇÃO DA REGRA DO SEU INDICADOR ORIGINAL ---
        // AtivoBase simulado pelo fechamento e AtivoRef simulado com dispersão estrutural
        const vAssetPrice = closePrice * 0.95; 
        const vAssetCloseD1 = openPrice * 0.948; 
        const vGraficoCloseD1 = openPrice;     

        // Linha 88: vFatorConversao := (vgraficocloseD1 / vassetcloseD1) * AjusteFator 
        const vFatorConversao = (vGraficoCloseD1 / vAssetCloseD1) * AJUSTE_FATOR;
        document.getElementById('fator-val').innerText = vFatorConversao.toFixed(5);

        // Linha 94: vprecoplot := (vassetprice * vfatorConversao) + DeslocamentoVertical;
        const vPrecoPlot = (vAssetPrice * vFatorConversao) + DESLOCAMENTO_VERTICAL;

        // Linha 64: TipoMedia = 0 -> VassetMedia := Media(periodoRef, AtivoReferencia.close)
        historicoPrecosRef.push(vAssetPrice);
        if (historicoPrecosRef.length > PERIODO_REF) historicoPrecosRef.shift();
        const somaMédia = historicoPrecosRef.reduce((a, b) => a + b, 0);
        const vAssetMedia = somaMédia / historicoPrecosRef.length;

        // Linha 96: vMediaplot := (vassetMedia * vFatorConversao) + DeslocamentoVertical;
        const vMediaPlot = (vAssetMedia * vFatorConversao) + DESLOCAMENTO_VERTICAL;

        // Linha 109: vhistref := vprecoplot - vmediaplot;
        const vHistRef = vPrecoPlot - vMediaPlot;

        // Injeta os três fluxos de dados de forma síncrona mantendo o histórico limpo na tela
        const limitePontos = chart.series[0].data.length > 60;
        chart.series[0].addPoint([time, vPrecoPlot], true, limitePontos);
        chart.series[1].addPoint([time, vMediaPlot], true, limitePontos);
        chart.series[2].addPoint([time, vHistRef], true, limitePontos);
    };
}

iniciarSistema();
</script>
</body>
</html>
