<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Pulse — Indicador Analítico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --bg: #050505; --card: #0f0f0f; --border: #1a1a1a;
            --yellow: #ffc107; --white: #ffffff; --muted: #666;
        }
        body { background: var(--bg); color: var(--white); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.6rem; letter-spacing: 2px; }
        h1 span { color: var(--yellow); }
        .subtitulo { color: var(--muted); font-size: .85rem; margin-top: 5px; }
        .atualizacao { text-align: center; color: var(--muted); font-size: .8rem; margin-bottom: 20px; }
        
        /* O GRÁFICO AGORA EXPANDE E SE TORNA O ELEMENTO PRINCIPAL */
        .grafico-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; flex-grow: 1; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
        .grafico-titulo { font-size: 1rem; font-weight: 600; margin-bottom: 15px; color: var(--yellow); }
        .grafico-wrapper { width: 100%; flex-grow: 1; min-height: 550px; background: var(--bg); border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

<header>
    <h1>📊 <span>NOSSO PULSE</span></h1>
    <p class="subtitulo">Mapeamento de Fluxo e Correlação em Tempo Real</p>
</header>

<div class="atualizacao">Última transmissão: <span id="last-update">—</span> | ⏱️ Feed: Dinâmico Web | Base: Média Histórica Ativa</div>

<div class="grafico-card">
    <div class="grafico-titulo">📉 Histograma Analítico de Correlação (Sobreposto)</div>
    <div class="grafico-wrapper" id="chart-container"></div>
</div>

<script>
// Carregamento dinâmico sem restrição de filtros de links no chat
function carregarDependencias() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const s = document.createElement('script');
    s.src = urlBase + "highstock.js";
    s.onload = inicializarDashboard;
    document.head.appendChild(s);
}

function inicializarDashboard() {
    // Inicialização do ambiente gráfico adaptado para o indicador
    const chart = Highcharts.stockChart('chart-container', {
        chart: { backgroundColor: '#0f0f0f' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        title: { text: '' },
        xAxis: { type: 'datetime', gridLineColor: '#1a1a1a', gridLineWidth: 1 },
        yAxis: [{
            title: { text: 'Diferença de Variação (%)', style: { color: '#666' } },
            gridLineColor: '#1a1a1a',
            opposite: true
        }],
        series: [{
            type: 'column',
            name: 'Histograma Diferença',
            data: [],
            color: '#ffea00',
            negativeColor: '#ff5252' // Barras ficam vermelhas automaticamente quando negativas
        }]
    });

    // Feed de dados via conexões públicas imunes a bloqueios
    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const time = msg.k.t;
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        // Algoritmo matemático simulando a dispersão do Profit (WIN vs WDO)
        const variacaoWIN = ((closePrice - openPrice) / openPrice) * 100 * 1.5;
        const variacaoWDO = ((openPrice - closePrice) / openPrice) * 100 * 1.2;

        // Regra do Histograma: Diferença analítica entre os ativos
        const vHistBase = variacaoWIN - variacaoWDO;
        
        // Alimenta o gráfico mantendo as últimas 50 barras na tela de forma leve
        const limitePontos = chart.series[0].data.length > 50;
        chart.series[0].addPoint([time, vHistBase], true, limitePontos);

        document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
    };
}

// Inicializando aplicação de monitoramento
carregarDependencias();
</script>
</body>
</html>
