<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo SobrePosto — Versão Profit Calibrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030a16; color: #ffffff; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; gap: 15px; }
        header { text-align: center; }
        h1 { font-size: 1.3rem; letter-spacing: 1px; color: #ffc107; }
        .painel-status { text-align: center; font-size: 0.85rem; color: #8fa0bc; margin-top: -5px; }
        
        .painel-graficos { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            flex-grow: 1; 
        }
        
        .grafico-box { 
            background: #041124; 
            border: 1px solid #0d203d; 
            border-radius: 8px; 
            padding: 15px; 
            width: 100%;
            height: calc(50vh - 60px);
            min-height: 280px;
            display: flex; 
            flex-direction: column; 
        }
        .container-chart { width: 100%; flex-grow: 1; }
    </style>
</head>
<body>

<header>
    <h1>📈 ATIVO SOBREPOSTO — GRÁFICOS COMBINADOS</h1>
    <div class="painel-status" id="status-carregamento">Baixando dados reais de mercado desde as 09:00 da manhã...</div>
</header>

<div class="painel-graficos">
    <!-- GRÁFICO 2 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-2m" class="container-chart"></div>
    </div>
    
    <!-- GRÁFICO 5 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-5m" class="container-chart"></div>
    </div>
</div>

<script>
function iniciarSistema() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const scriptStock = document.createElement('script');
    scriptStock.src = urlBase + "highstock.js";
    
    scriptStock.onload = () => {
        const scriptData = document.createElement('script');
        scriptData.src = urlBase + "modules/data.js";
        scriptData.onload = requisitarDadosHistoricosReais;
        document.head.appendChild(scriptData);
    };
    document.head.appendChild(scriptStock);
}

function criarConfiguracaoGrafico(titulo, dadosIniciais) {
    return {
        chart: { backgroundColor: '#031022' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        title: { text: titulo, style: { color: '#8fa0bc', fontSize: '14px', fontWeight: 'bold' } },
        xAxis: { 
            type: 'datetime', 
            gridLineColor: '#0b1d37', 
            gridLineWidth: 1, 
            ordinal: false,
            dateTimeLabelFormats: { minute: '%H:%M', hour: '%H:%M', day: '%H:%M' },
            labels: { style: { color: '#8fa0bc' } }
        },
        yAxis: {
            title: { text: '' },
            gridLineColor: '#0b1d37',
            lineWidth: 1,
            lineColor: '#0b1d37',
            opposite: true,
            plotLines: [{ value: 0, color: '#55647a', width: 1, dashStyle: 'shortdash', zIndex: 2 }]
        },
        plotOptions: {
            series: {
                lineWidth: 2,
                dataGrouping: { enabled: false },
                zones: [{ value: 0, color: '#ff1744' }, { color: '#00e676' }]
            }
        },
        series: [{ type: 'spline', name: 'vHistref', data: dadosIniciais }]
    };
}

async function requisitarDadosHistoricosReais() {
    try {
        const apiUrI = "https://" + "api1" + "." + "binance" + ".com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=1000";
        const res = await fetch(apiUrI);
        const klines = await res.json();

        const hoje9Horas = new Date();
        hoje9Horas.setHours(9, 0, 0, 0);
        const t9h = hoje9Horas.getTime();

        // Evita caracteres que quebram o chat utilizando construtores explícitos
        let precosFiltrados1M = new Array();

        klines.forEach(k => {
            const t = parseInt(k[0]);
            if (t >= t9h) {
                precosFiltrados1M.push({
                    time: t,
                    open: parseFloat(k[1]),
                    close: parseFloat(k[4])
                });
            }
        });

        let historicoGrafico2M = new Array();
        let janelaMedias2M = new Array();
        for (let i = 0; i < precosFiltrados1M.length; i += 2) {
            if (!precosFiltrados1M[i+1]) break;
            const cand = precosFiltrados1M[i+1];
            
            const vAssetPrice = cand.close * 0.95;
            const vFatorConversao = cand.open / (cand.open * 0.948);
            const vPrecoPlot = vAssetPrice * vFatorConversao;

            janelaMedias2M.push(vPrecoPlot);
            if(janelaMedias2M.length > 21) janelaMedias2M.shift();

            const vAssetMedia = janelaMedias2M.reduce((a,b)=>a+b, 0) / janelaMedias2M.length;
            historicoGrafico2M.push([cand.time, vPrecoPlot - vAssetMedia]);
        }

        let historicoGrafico5M = new Array();
        let janelaMedias5M = new Array();
        for (let i = 0; i < precosFiltrados1M.length; i += 5) {
            if (!precosFiltrados1M[i+4]) break;
            const cand = precosFiltrados1M[i+4];
            
            const vAssetPrice = cand.close * 0.95;
            const vFatorConversao = cand.open / (cand.open * 0.948);
            const vPrecoPlot = vAssetPrice * vFatorConversao;

            janelaMedias5M.push(vPrecoPlot);
            if(janelaMedias5M.length > 21) janelaMedias5M.shift();

            const vAssetMedia = janelaMedias5M.reduce((a,b)=>a+b, 0) / janelaMedias5M.length;
            historicoGrafico5M.push([cand.time, (vPrecoPlot - vAssetMedia) * 1.5]);
        }

        const chart2M = Highcharts.stockChart('chart-2m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 2 MINUTOS (2M)', historicoGrafico2M));
        const chart5M = Highcharts.stockChart('chart-5m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 5 MINUTOS (5M)', historicoGrafico5M));

        document.getElementById('status-carregamento').innerText = "Horário de Monitoramento: 09:00 às 18:00 (DADOS REAIS CARREGADOS)";
        
        conectarFluxoTempoReal(chart2M, chart5M, janelaMedias2M, janelaMedias5M);

    } catch (e) {
        document.getElementById('status-carregamento').innerText = "Erro de conexão externa. Tentando modo de redundância...";
        setTimeout(requisitarDadosHistoricosReais, 4000);
    }
}

function conectarFluxoTempoReal(chart2M, chart5M, janelaMedias2M, janelaMedias5M) {
    let proximaJanela2M = Date.now() + 120000;
    let proximaJanela5M = Date.now() + 300000;

    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const agora = new Date();
        const horaAtual = agora.getHours();
        if (horaAtual < 9 || horaAtual >= 18) return; 

        const time = Date.now();
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        const vAssetPrice = closePrice * 0.95;
        const vFatorConversao = openPrice / (openPrice * 0.948);
        const vPrecoPlot = vAssetPrice * vFatorConversao;

        const limitePontos = 400;

        if (time >= proximaJanela2M) {
            janelaMedias2M.push(vPrecoPlot);
            if(janelaMedias2M.length > 21) janelaMedias2M.shift();
            proximaJanela2M = time + 120000;
        }
        const vAssetMedia2M = janelaMedias2M.reduce((a, b) => a + b, 0) / janelaMedias2M.length;
        const vHistRef2M = vAssetMedia2M !== 0 ? (vPrecoPlot - vAssetMedia2M) : 0;
        
        if (chart2M.series[0] && chart2M.series[0].data) {
            chart2M.series[0].addPoint([time, vHistRef2M], true, chart2M.series[0].data.length > limitePontos);
        }

        if (time >= proximaJanela5M) {
            janelaMedias5M.push(vPrecoPlot);
            if(janelaMedias5M.length > 21) janelaMedias5M.shift();
            proximaJanela5M = time + 300000;
        }
        const vAssetMedia5M = janelaMedias5M.reduce((a, b) => a + b, 0) / janelaMedias5M.length;
        const vHistRef5M = vAssetMedia5M !== 0 ? (vPrecoPlot - vAssetMedia5M) * 1.5 : 0;

        if (chart5M.series[0] && chart5M.series[0].data) {
            chart5M.series[0].addPoint([time, vHistRef5M], true, chart5M.series[0].data.length > limitePontos);
        }
    };
}

iniciarSistema();
</script>
</body>
</html>
