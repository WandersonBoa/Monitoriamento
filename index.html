<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo SobrePosto — 2Min e 5Min</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030a16; color: #ffffff; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; gap: 15px; }
        header { text-align: center; }
        h1 { font-size: 1.3rem; letter-spacing: 1px; color: #ffc107; }
        
        /* Container que divide a tela ao meio para os dois gráficos */
        .painel-graficos { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            flex-grow: 1; 
        }
        @media(min-width: 900px) {
            .painel-graficos { flex-direction: row; }
        }
        
        .grafico-box { 
            background: #041124; 
            border: 1px solid #0d203d; 
            border-radius: 8px; 
            padding: 15px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .container-chart { width: 100%; flex-grow: 1; min-height: 380px; }
    </style>
</head>
<body>

<header>
    <h1>📈 ATIVO SOBREPOSTO — GRÁFICOS COMBINADOS</h1>
</header>

<div class="painel-graficos">
    <!-- GRÁFICO 2 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-2m" class="container-chart"></div>
    </div>
    
    <!-- GRÁFICO 5 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-5m" class="container-chart"></div>
    </div>
</div>

<script>
function iniciarSistema() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const scriptStock = document.createElement('script');
    scriptStock.src = urlBase + "highstock.js";
    
    scriptStock.onload = () => {
        const scriptData = document.createElement('script');
        scriptData.src = urlBase + "modules/data.js";
        scriptData.onload = rodarIndicadores;
        document.head.appendChild(scriptData);
    };
    document.head.appendChild(scriptStock);
}

function criarConfiguracaoGrafico(titulo, corLinhaBase) {
    return {
        chart: { backgroundColor: '#031022' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        title: { text: titulo, style: { color: '#8fa0bc', fontSize: '14px', fontWeight: 'bold' } },
        xAxis: { type: 'datetime', gridLineColor: '#0b1d37', gridLineWidth: 1, ordinal: false },
        yAxis: {
            title: { text: '' },
            gridLineColor: '#0b1d37',
            lineWidth: 1,
            lineColor: '#0b1d37',
            opposite: true,
            // Desenha a linha de referência central exatamente em 0
            plotLines: [{
                value: 0,
                color: '#00ff88',
                width: 1,
                dashStyle: 'shortdash',
                zIndex: 4
            }]
        },
        plotOptions: {
            series: {
                lineWidth: 2,
                dataGrouping: { enabled: false },
                // Configuração visual da imagem: Verde acima de zero, Vermelho abaixo
                zones: [{
                    value: 0,
                    color: '#ff1744' // Vermelho para valores negativos
                }, {
                    color: '#00e676' // Verde para valores positivos
                }]
            }
        },
        series: [{
            name: 'vHistref',
            data: []
        }]
    };
}

function rodarIndicadores() {
    // Inicializa os dois gráficos independentes na tela
    const chart2M = Highcharts.stockChart('chart-2m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 2 MINUTOS (2M)', '#ff1744'));
    const chart5M = Highcharts.stockChart('chart-5m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 5 MINUTOS (5M)', '#00e676'));

    // Histórico para cálculo das médias móveis originais
    let dados2M = [];
    let dados5M = [];

    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const time = Date.now();
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        // Estrutura matemática da sua regra do Profit convertida
        const vAssetPrice = closePrice * 0.95;
        const vFatorConversao = openPrice / (openPrice * 0.948);
        const vPrecoPlot = vAssetPrice * vFatorConversao;

        // --- CÁLCULO PARA O GRÁFICO DE 2 MINUTOS ---
        dados2M.push(vPrecoPlot);
        if(dados2M.length > 21) dados2M.shift();
        const media2M = dados2M.reduce((a, b) => a + b, 0) / dados2M.length;
        const vHistRef2M = vPrecoPlot - media2M;

        // --- CÁLCULO PARA O GRÁFICO DE 5 MINUTOS (Filtro multiplicador de suavização) ---
        dados5M.push(vPrecoPlot);
        if(dados5M.length > 50) dados5M.shift();
        const media5M = dados5M.reduce((a, b) => a + b, 0) / dados5M.length;
        // O multiplicador amplifica a distorção para simular o tempo maior (5M) com precisão visual
        const vHistRef5M = (vPrecoPlot - media5M) * 1.4; 

        const limitePontos = chart2M.series[0].data.length > 80;

        // Atualiza ambos de forma síncrona lado a lado
        chart2M.series[0].addPoint([time, vHistRef2M], true, limitePontos);
        chart5M.series[0].addPoint([time, vHistRef5M], true, limitePontos);
    };
}

iniciarSistema();
</script>
</body>
</html>
