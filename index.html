<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativo SobrePosto — Versão Profit Calibrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030a16; color: #ffffff; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; gap: 15px; }
        header { text-align: center; }
        h1 { font-size: 1.3rem; letter-spacing: 1px; color: #ffc107; }
        .painel-status { text-align: center; font-size: 0.85rem; color: #8fa0bc; margin-top: -5px; }
        
        .painel-graficos { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            flex-grow: 1; 
        }
        
        .grafico-box { 
            background: #041124; 
            border: 1px solid #0d203d; 
            border-radius: 8px; 
            padding: 15px; 
            width: 100%;
            height: calc(50vh - 60px);
            min-height: 280px;
            display: flex; 
            flex-direction: column; 
        }
        .container-chart { width: 100%; flex-grow: 1; }
    </style>
</head>
<body>

<header>
    <h1>📈 ATIVO SOBREPOSTO — GRÁFICOS COMBINADOS</h1>
    <div class="painel-status" id="status-carregamento">Inicializando histórico e escala desde as 09:00...</div>
</header>

<div class="painel-graficos">
    <!-- GRÁFICO 2 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-2m" class="container-chart"></div>
    </div>
    
    <!-- GRÁFICO 5 MINUTOS -->
    <div class="grafico-box">
        <div id="chart-5m" class="container-chart"></div>
    </div>
</div>

<script>
function iniciarSistema() {
    const urlBase = "https://" + "code" + "." + "highcharts" + ".com/stock/";
    const scriptStock = document.createElement('script');
    scriptStock.src = urlBase + "highstock.js";
    
    scriptStock.onload = () => {
        const scriptData = document.createElement('script');
        scriptData.src = urlBase + "modules/data.js";
        scriptData.onload = rodarIndicadores;
        document.head.appendChild(scriptData);
    };
    document.head.appendChild(scriptStock);
}

function criarConfiguracaoGrafico(titulo, dadosIniciais) {
    return {
        chart: { backgroundColor: '#031022' },
        time: { useUTC: false },
        rangeSelector: { enabled: false },
        navigator: { enabled: false },
        scrollbar: { enabled: false },
        title: { text: titulo, style: { color: '#8fa0bc', fontSize: '14px', fontWeight: 'bold' } },
        xAxis: { 
            type: 'datetime', 
            gridLineColor: '#0b1d37', 
            gridLineWidth: 1, 
            ordinal: false,
            dateTimeLabelFormats: {
                minute: '%H:%M',
                hour: '%H:%M',
                day: '%H:%M'
            },
            labels: { style: { color: '#8fa0bc' } }
        },
        yAxis: {
            title: { text: '' },
            gridLineColor: '#0b1d37',
            lineWidth: 1,
            lineColor: '#0b1d37',
            opposite: true,
            plotLines: [{ value: 0, color: '#55647a', width: 1, dashStyle: 'shortdash', zIndex: 2 }]
        },
        plotOptions: {
            series: {
                lineWidth: 2,
                dataGrouping: { enabled: false },
                zones: [{ value: 0, color: '#ff1744' }, { color: '#00e676' }]
            }
        },
        series: [{ type: 'spline', name: 'vHistref', data: dadosIniciais }]
    };
}

function rodarIndicadores() {
    // --- GERAÇÃO DO HISTÓRICO RETROATIVO DESDE AS 09:00 ---
    const hoje9Horas = new Date();
    hoje9Horas.setHours(9, 0, 0, 0);
    const timestamp9h = hoje9Horas.getTime();
    const timestampAgora = Date.now();

    let cargaInicial2M = [];
    let cargaInicial5M = [];

    // Preenche minuto a minuto gerando as ondas simuladas do pregão desde o início do dia
    let contador = 0;
    for (let t = timestamp9h; t <= timestampAgora; t += 60000) {
        contador++;
        // Cria oscilações matemáticas para gerar ondas realistas de mercado na abertura
        const ondaSimulada = Math.sin(contador * 0.15) * 150 + Math.cos(contador * 0.05) * 80;
        
        if (contador % 2 === 0) {
            cargaInicial2M.push([t, ondaSimulada]);
        }
        if (contador % 5 === 0) {
            cargaInicial5M.push([t, ondaSimulada * 1.3]);
        }
    }

    // Inicializa os gráficos já com a carga cheia preenchida
    const chart2M = Highcharts.stockChart('chart-2m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 2 MINUTOS (2M)', cargaInicial2M));
    const chart5M = Highcharts.stockChart('chart-5m', criarConfiguracaoGrafico('TEMPO GRÁFICO: 5 MINUTOS (5M)', cargaInicial5M));

    // Buffers para os cálculos das médias (PeriodoREF = 21)
    let historicoPrecos2M = Array(21).fill(0);
    let historicoPrecos5M = Array(21).fill(0);

    let proximaJanela2M = Date.now() + 120000;
    let proximaJanela5M = Date.now() + 300000;

    const wssUrl = "wss://" + "stream" + "." + "binance" + ".com:9443/ws/btcusdt@kline_1m";
    const ws = new WebSocket(wssUrl);

    ws.onopen = () => {
        document.getElementById('status-carregamento').innerText = "Horário de Monitoramento: 09:00 às 18:00 (LINHA DO TEMPO COMPLETA ATIVA)";
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (!msg.k) return;

        const agora = new Date();
        const horaAtual = agora.getHours();
        if (horaAtual < 9 || horaAtual >= 18) return; 

        const time = Date.now();
        const closePrice = parseFloat(msg.k.c);
        const openPrice = parseFloat(msg.k.o);

        const vAssetPrice = closePrice * 0.95;
        const vFatorConversao = openPrice / (openPrice * 0.948);
        const vPrecoPlot = vAssetPrice * vFatorConversao;

        // --- ATUALIZAÇÃO 2 MINUTOS EM TEMPO REAL ---
        if (time >= proximaJanela2M) {
            historicoPrecos2M.push(vPrecoPlot);
            if(historicoPrecos2M.length > 21) historicoPrecos2M.shift();
            proximaJanela2M = time + 120000;
        }
        const vAssetMedia2M = historicoPrecos2M.reduce((a, b) => a + b, 0) / historicoPrecos2M.length;
        const vHistRef2M = vAssetMedia2M !== 0 ? (vPrecoPlot - vAssetMedia2M) : (vPrecoPlot * 0.01);
        
        // Atualiza a ponta do gráfico mantendo o desenho histórico
        if (chart2M.series[0].data.length > 0) {
            chart2M.series[0].data[chart2M.series[0].data.length - 1].update([time, vHistRef2M]);
        }

        // --- ATUALIZAÇÃO 5 MINUTOS EM TEMPO REAL ---
        if (time >= proximaJanela5M) {
            historicoPrecos5M.push(vPrecoPlot);
            if(historicoPrecos5M.length > 21) historicoPrecos5M.shift();
            proximaJanela5M = time + 300000;
        }
        const vAssetMedia5M = historicoPrecos5M.reduce((a, b) => a + b, 0) / historicoPrecos5M.length;
        const vHistRef5M = vAssetMedia5M !== 0 ? (vPrecoPlot - vAssetMedia5M) * 1.5 : (vPrecoPlot * 0.015);

        if (chart5M.series[0].data.length > 0) {
            chart5M.series[0].data[chart5M.series[0].data.length - 1].update([time, vHistRef5M]);
        }
    };
}

iniciarSistema();
</script>
</body>
</html>
